# Wanderbibliothek en Docker.
#
#   cp deploy/env.example .env      # rellena URL, correo y secretos
#   docker compose up -d --build
#   docker compose exec -T app node --import tsx scripts/create-admin.ts …  (ver abajo)
#
# La aplicación escucha solo en 127.0.0.1:3000: pon un proxy con TLS delante
# (el nginx de deploy/nginx.conf sirve apuntando a 127.0.0.1:3000).
# Para probar en local, http://localhost:3000 funciona: el navegador trata
# localhost como contexto seguro y acepta la cookie __Host-.

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* se fija en el BUILD, no en tiempo de ejecución.
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: wanderbibliothek:latest
    restart: unless-stopped
    # Recoge los procesos hijos (Next no suele dejar zombis, pero si algún día
    # lanza uno, no se queda colgado del PID 1).
    init: true
    # El proceso solo necesita leer sus ficheros y escuchar en el 3000: no debe
    # poder ganar privilegios ni usar capabilities del kernel.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      # Sobrescriben lo que venga en .env: dentro del contenedor las rutas son
      # estas, y las carpetas son volúmenes.
      WANDERBIBLIOTHEK_DB: /data/wanderbibliothek.db
      WANDERBIBLIOTHEK_BACKUP_DIR: /backups
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - wanderbibliothek-data:/data
      - wanderbibliothek-backups:/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # Las conexiones SSE (/api/requests/…) son de larga duración: el mismo
    # margen que TimeoutStopSec en la unidad systemd.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wanderbibliothek-data:
  wanderbibliothek-backups:
