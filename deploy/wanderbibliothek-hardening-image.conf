# Endurecimiento de la unidad que lanza el contenedor.
#
# El aislamiento de la aplicación lo aplica Docker. Esta unidad solo necesita
# escribir el entorno efímero del cliente Docker y dejar los datos al contenedor.
[Service]
ProtectSystem=strict
ReadWritePaths=/run/wanderbibliothek
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallFilter=~@privileged @obsolete @mount @debug @cpu-emulation @swap @reboot
MemoryHigh=1024M
MemoryMax=1536M
TasksMax=256
