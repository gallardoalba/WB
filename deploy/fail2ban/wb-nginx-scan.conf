# Sondeos web: rutas que esta aplicación no tiene (WordPress, .env, .git,
# phpMyAdmin, PHP suelto...). Si además responden 4xx, es un escáner.
#
# ⚠ El formato de fecha se escribe `\[\]` a propósito, **no** `\[[^\]]+\]`:
# fail2ban quita el texto de la fecha antes de aplicar la expresión regular
# (fail2ban-regex lo confirma: con el patrón completo no casa ni una línea).
# Desde que nginx devuelve `444` a estas rutas, ese código también cuenta.
[Definition]
failregex = ^<HOST> - - \[\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) [^"]*(?:\.env|/\.git|wp-(?:login|admin|json|signup|content|includes)|xmlrpc\.php|phpmyadmin|phpinfo|\.php|config\.json|\.aws|/vendor/|/cgi-bin/|/actuator|/solr/|HNAP|boaform|autodiscover|/owa/|\.\./)[^"]*" (?:400|401|403|404|405|444)
ignoreregex =
