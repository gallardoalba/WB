# nginx delante de Wanderbibliothek.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/book2peer
#   sudo ln -s /etc/nginx/sites-available/book2peer /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d biblioteca.example.com     (rellena el TLS)
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP solo para redirigir y para el reto de Let's Encrypt.
server {
    listen 80;
    listen [::]:80;
    server_name biblioteca.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` en la línea de `listen` funciona en nginx 1.18–1.22 (Ubuntu 22.04,
    # Debian 12). En 1.25+ se prefiere `listen 443 ssl;` + `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name biblioteca.example.com;

    ssl_certificate     /etc/letsencrypt/live/biblioteca.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biblioteca.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # El API corta en 64 KB; el margen cubre cabeceras y formularios normales.
    client_max_body_size 128k;
    server_tokens off;

    # Next ya envía las cabeceras de seguridad (CSP, HSTS, COOP/CORP). Aquí solo
    # se añaden las que el proxy puede aplicar antes de llegar a la aplicación.
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/book2peer.access.log;
    error_log  /var/log/nginx/book2peer.error.log warn;

    # Servicio estático: inmutable por hash, se puede cachear sin miedo.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mensajería en vivo (Server-Sent Events): sin buffering y con timeout
    # largo, o el navegador se queda sin avisos y el mensaje tarda en llegar.
    location /api/requests/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TRUST_PROXY=1 en el entorno de la app lee estas dos cabeceras.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
