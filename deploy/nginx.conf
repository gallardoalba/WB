# nginx delante de Wanderbibliothek.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wanderbibliothek
#   sudo ln -s /etc/nginx/sites-available/wanderbibliothek /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d biblioteca.example.com     (rellena el TLS)
#   sudo nginx -t && sudo systemctl reload nginx

# Límite de ritmo en el borde, antes de llegar a Node.
#
# La aplicación ya limita los intentos en SQLite, pero cada intento rechazado
# sigue siendo una escritura en la base: absorber el ruido aquí evita que un
# flood de /api/auth/login convierta el disco del servidor en el cuello de
# botella. 10 MB guardan ~160 000 IPs.
limit_req_zone $binary_remote_addr zone=wb_auth:10m rate=10r/m;
# 120 r/m (2 por segundo) con un margen de 120 peticiones: una página normal
# pide ~30 ficheros de golpe y entra de sobra, mientras que un barrido de
# cientos de peticiones se lleva un 429 y el jail `wb-nginx-limit` lo ve.
limit_req_zone $binary_remote_addr zone=wb_global:10m rate=120r/m;
# Rutas con prefijo de idioma (`/es/…`, `/en/…`): son las mismas páginas para
# SEO. Un humano entra por una o dos; un barrido las recorre todas.
limit_req_zone $binary_remote_addr zone=wb_lang:10m rate=60r/m;
limit_req_status 429;

# Caché de lo que no cambia, en el borde.
#
# Las portadas son el objeto más pesado de la aplicación y su URL lleva versión
# (`?v=…`, la pone la app al subir la imagen): la clave de caché incluye esa
# versión, así que no hay nada que invalidar cuando alguien sustituye una
# portada, y Node deja de enviar bytes de imagen en cada visita.
proxy_cache_path /var/cache/nginx/wb_images levels=1:2 keys_zone=wb_images:16m
                 max_size=1g inactive=30d use_temp_path=off;

# `/_next/image` negocia el formato con `Accept` y responde `Vary: Accept`. La
# caché de nginx no mira `Vary`, así que el formato entra en la clave; si no,
# un navegador podría recibir el WebP que se guardó para otro. Tres valores como
# mucho, no una entrada por cadena de `Accept`.
map $http_accept $wb_image_format {
    default        "jpg";
    "~*image/webp" "webp";
    "~*image/avif" "avif";
}

# Registro sin la cadena de consulta.
#
# `$request` y `$request_uri` incluyen el `?…`: ahí viajaban los enlaces de un
# solo uso (`?token=…`) y las búsquedas de cada visitante. `$uri` es la ruta ya
# normalizada y sin parámetros, así que el log sirve para diagnosticar sin
# guardar datos personales de más.
log_format wb '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
             '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time $request_id';

# Host desconocido (la IP desnuda, un dominio antiguo, un SNI ajeno): se cierra
# la conexión en vez de servir la página por defecto de nginx o la aplicación
# bajo un nombre que no es el suyo.
#
# Debian trae `/etc/nginx/sites-enabled/default` haciendo ese papel, así que hay
# que retirarlo o nginx se queja de dos `default_server` en el mismo puerto:
#   sudo rm /etc/nginx/sites-enabled/default
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # Sin `ssl_certificate` a propósito: rechaza el saludo TLS (nginx 1.19.4+),
    # así que no hay certificado que enseñar a quien llega por un nombre que no
    # atiende nadie.
    ssl_reject_handshake on;
}

# HTTP solo para redirigir y para el reto de Let's Encrypt.
server {
    listen 80;
    listen [::]:80;
    server_name biblioteca.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Debian 13 trae nginx 1.26+ y ahí `listen 443 ssl http2;` está obsoleto: se
    # separa la directiva. En nginx 1.18–1.22 (Ubuntu 22.04, Debian 12) hay que
    # volver a la forma antigua, en la propia línea de `listen`.
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/3 (QUIC). El módulo `http_v3_module` viene compilado en Debian 13 y
    # el navegador cae a HTTP/2 si no puede. Necesita UDP 443 abierto en el
    # cortafuegos: `sudo ufw allow 443/udp`.
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    # Anuncia HTTP/3 a quien llegue por HTTP/2; `ma` se renueva con cada visita.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name biblioteca.example.com;

    ssl_certificate     /etc/letsencrypt/live/biblioteca.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biblioteca.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Las «tickets» de sesión usan una clave que nginx no rota por sí solo: con
    # ellas activas, quien consiga esa clave puede descifrar tráfico antiguo.
    ssl_session_tickets off;

    # Aquí NO hay `ssl_stapling`: Let's Encrypt dejó de publicar URLs OCSP, así
    # que nginx descarta la directiva con «ssl_stapling ignored, no OCSP
    # responder URL in the certificate» en cada recarga. Con estos certificados
    # no aporta nada; si algún día se usa otra CA, se vuelve a poner junto con
    # `ssl_trusted_certificate` y un `resolver`.

    # El API corta en 64 KB; el margen cubre cabeceras y formularios normales.
    # Las portadas tienen su propia ubicación, más abajo, con 8 MB.
    client_max_body_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    server_tokens off;

    # Compresión en el borde. `gzip_proxied any` es imprescindible: sin él nginx
    # no comprime respuestas proxyficadas (todo lo que viene de Next) y el CSS
    # de 134 KB y el megabyte de JS viajaban tal cual. `gzip_static` está
    # compilado, así que un .gz al lado del fichero se sirve sin recomprimir.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_static on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/xml+rss
        application/manifest+json image/svg+xml;

    # Next ya envía las cabeceras de seguridad (CSP, HSTS, COOP/CORP y
    # `nosniff`). Aquí no se repiten: duplicarlas mandaba la misma cabecera dos
    # veces en cada respuesta. La única excepción es `/_next/static/`, que no
    # pasa por el middleware de la app y por eso la añade su propia ubicación.
    #
    # Ojo con `add_header`: dentro de un `location` SUSTITUYE a los del
    # servidor, no se suman. Por eso `X-Request-Id` **no** está aquí arriba y sí
    # en cada ubicación que define cabeceras propias: las que pasan por la app ya
    # lo reciben de ella, y las de estáticos lo necesitan para poder cruzar una
    # imagen que no carga con su línea del registro.

    access_log /var/log/nginx/wanderbibliothek.access.log wb;
    error_log  /var/log/nginx/wanderbibliothek.error.log warn;

    # Tareas programadas y métricas: solo desde el propio host. El token ya
    # protege las dos rutas, pero no hay razón para publicar en Internet una
    # tarea de escritura ni un endpoint que acepta el mismo secreto sin cookie.
    # Quien administra las lee con `curl` desde el servidor, que es donde
    # interesan.
    location = /api/metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /api/cron/maintenance {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Acceso y cuentas: el punto donde un atacante prueba contraseñas.
    location ~ ^/api/(auth/(login|register|forgot|reset|verify)|account/(password|totp)) {
        limit_req zone=wb_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # Los assets de Next deben salir de la misma imagen que generó el HTML.
    # El checkout `current` puede contener otra compilación. Next añade las
    # cabeceras de caché adecuadas a cada asset; no se marca un 404 como inmutable.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-Id $request_id always;
        access_log off;
    }

    # Recursos de `public/`: la foto del héroe, iconos y fuentes salen de la
    # misma imagen que genera el HTML; no se sirven desde el checkout `current`.
    # Next conserva aquí su política de revalidación para evitar assets obsoletos.
    location ~* ^/(fonts|icons|hero)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-Id $request_id always;
        access_log off;
    }

    # Mensajería en vivo (Server-Sent Events): sin buffering y con timeout
    # largo, o el navegador se queda sin avisos y el mensaje tarda en llegar.
    #
    # El prefijo tiene que casar TAMBIÉN con la ruta exacta (`/api/requests`, sin
    # barra final): con `location /api/requests/` el listado se lo llevaba
    # `location /`, Next lo redirigía a `/api/requests/` y esta regla lo devolvía
    # otra vez a `/api/requests`. Ese bucle 301/308 la app no lo sigue —no sigue
    # redirecciones con la cookie puesta— y acababa mostrando «Algo ha ido mal».
    location ^~ /api/requests {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Portadas: el cuerpo es una imagen de hasta 4 MB, así que los 128 KB
    # generales (pensados para JSON) la cortaban con un 413 que la aplicación
    # no podía explicar. `^~` evita que una expresión regular se lo lleve por
    # delante.
    location ^~ /api/cover/ {
        client_max_body_size 8m;
        # Las portadas grandes se guardaban en un fichero temporal del proxy
        # (avisos «buffered to a temporary file»): se envían en cuanto llegan.
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        # La portada original tampoco cambia: nginx la guarda y la sirve él.
        # `nginx` solo cachea GET y HEAD, así que subir o borrar una portada
        # (PUT/DELETE) sigue llegando a la aplicación; y como la URL que reparte
        # la app lleva versión, una imagen nueva es una clave nueva.
        proxy_cache wb_images;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        access_log off;
        # Un `add_header` dentro de un `location` sustituye a los del servidor:
        # se repiten los dos que importan en una respuesta de imagen.
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Request-Id $request_id always;
    }

    # Tarjetas sociales (`/api/og/...`): se dibujan con Satori y tardan ~170 ms
    # en frío. La URL identifica la tarjeta (lleva el id y el idioma), así que
    # una hora de caché aquí es una hora que Node no vuelve a dibujar, también
    # para los rastreadores que piden la misma tarjeta en ráfaga.
    location ^~ /api/og/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache wb_images;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        access_log off;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Request-Id $request_id always;
    }

    # Imágenes optimizadas por Next (`/_next/image`): se generan una vez, al
    # tamaño del hueco y en WebP, y no cambian porque la URL lleva la versión de
    # la portada. Servirlas desde aquí descarga a Node del trabajo de leer y
    # enviar la imagen en cada visita.
    location ^~ /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache wb_images;
        proxy_cache_key "$scheme$host$request_uri:$wb_image_format";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        access_log off;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Request-Id $request_id always;
    }

    # Nombres que la gente teclea (o enlaces viejos que quedaron por ahí): al
    # destino real en un salto, en vez de un 404 desde la aplicación.
    location = /impressum { return 301 https://biblioteca.example.com/aviso-legal; }
    location = /en/imprint { return 301 https://biblioteca.example.com/aviso-legal; }
    location = /proyecto { return 301 https://biblioteca.example.com/projekt; }
    location = /dokumentation { return 301 https://biblioteca.example.com/techdoc; }
    location = /documentacion { return 301 https://biblioteca.example.com/techdoc; }
    location = /login { return 301 https://biblioteca.example.com/cuenta; }

    # Rutas que esta aplicación no tiene (WordPress, .env, .git, PHP suelto…).
    # Un escáner que las pide no merece ni respuesta: `444` cierra la conexión
    # sin enviar nada y la petición no llega a Node. Va antes de `location /`
    # porque las expresiones regulares se evalúan en orden de aparición; las
    # rutas `^~` (mensajería y portadas) siguen teniendo prioridad.
    location ~* (\.php|\.env|/\.git|/wp-|\.sql|\.bak|\.old|\.swp|\.DS_Store) {
        return 444;
    }

    # Raíz exacta: esta aplicación no tiene Server Actions (no hay ningún
    # «use server»), así que un POST a `/` solo puede ser una sonda. Se cierra
    # sin respuesta y el filtro de fail2ban la cuenta como escaneo.
    location = / {
        if ($request_method = POST) {
            return 444;
        }
        limit_req zone=wb_global burst=120 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Páginas con prefijo de idioma: conservan la cuota global y añaden una
    # propia, que es lo que frena el barrido de todas las rutas `/es/...`.
    location ~ ^/(es|en)/ {
        limit_req zone=wb_global burst=120 nodelay;
        limit_req zone=wb_lang burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    location / {
        # Presupuesto global por IP: deja pasar una navegación normal (y los
        # prefetch RSC) y corta los barridos automatizados. Es holgado a
        # propósito: varias personas pueden compartir IP detrás de un NAT o de
        # una operadora móvil.
        limit_req zone=wb_global burst=120 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TRUST_PROXY=1 en el entorno de la app lee estas dos cabeceras.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
}
