# Endurecimiento de la unidad, aparte para no ensuciar el fichero principal y
# poder retirarlo de golpe (``sudo rm` este fichero y `daemon-reload`).
#
# Se instala en `/etc/systemd/system/wanderbibliothek.service.d/hardening.conf`.
[Service]
# Todo el sistema de ficheros en solo lectura salvo lo que la app escribe de
# verdad: base, portadas, copias y la caché de Next (imágenes optimizadas y
# datos). El código de la release queda inmutable para el proceso: aunque lo
# comprometan, no puede reescribir la aplicación.
ProtectSystem=strict
ReadWritePaths=/var/lib/wanderbibliothek /var/backups/wanderbibliothek
# `current` es un enlace; systemd lo resuelve al arrancar y el despliegue
# reinicia el servicio, así que apunta siempre a la release nueva.
ReadWritePaths=/srv/wanderbibliothek/current/.next/cache
# El proceso no necesita ninguna capacidad del kernel.
CapabilityBoundingSet=
AmbientCapabilities=
# Lista negra de llamadas que un servidor web no usa nunca.
SystemCallFilter=~@privileged @obsolete @mount @debug @cpu-emulation @swap @reboot
# Tope de memoria y de tareas: si se descontrola, se reinicia él solo en vez
# de arrastrar al host al OOM.
MemoryHigh=1024M
MemoryMax=1536M
TasksMax=256
