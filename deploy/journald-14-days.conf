# Retención de journald para una instancia de Wanderbibliothek.
#
# Los logs del servicio van a journald y también llevan IPs. Por defecto journald
# guarda hasta el 10 % del disco; la política publicada dice 14 días, así que se
# fija aquí. Instalar en /etc/systemd/journald.conf.d/90-wanderbibliothek.conf
# y recargar con `systemctl restart systemd-journald`.
[Journal]
MaxRetentionSec=14day
