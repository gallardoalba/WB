# Bloqueo de rastreadores de entrenamiento de IA por User-Agent.
#
# Se instala en `/etc/nginx/conf.d/wanderbibliothek-ai.conf` (contexto `http`).
# Va con `robots.txt`, pero un bot puede ignorar el fichero: aquí se le responde
# 403 antes de llegar a Node. Los de búsqueda que provoca una persona
# (OAI-SearchBot, Claude-SearchBot, Perplexity-User, ChatGPT-User) siguen
# pasando: no son recolección masiva.
#
# ⚠ Debe coincidir con `AI_TRAINING_BOTS` de `src/app/robots.ts`.
map $http_user_agent $wb_ai_bot {
    default 0;
    "~*GPTBot"             1;
    "~*ClaudeBot"          1;
    "~*anthropic-ai"       1;
    "~*PerplexityBot"      1;
    "~*CCBot"              1;
    "~*Bytespider"         1;
    "~*Amazonbot"          1;
    "~*meta-externalagent" 1;
    "~*FacebookBot"        1;
    "~*cohere-ai"          1;
    "~*Diffbot"            1;
    "~*YouBot"             1;
    "~*Timpibot"           1;
    "~*ImagesiftBot"       1;
    "~*AI2Bot"             1;
    "~*Omgilibot"          1;
    "~*Kangaroo-Bot"       1;
    "~*PanguBot"           1;
    "~*image-meta\.com"    1;
    "~*AIWebIndex"         1;
    "~*RootEvidence"       1;
}

# robots.txt y el sitemap se dejan ver: es como el bot conoce la política.
map $request_uri $wb_ai_exempt {
    default 0;
    "~^/robots\.txt" 1;
    "~^/sitemap"     1;
}

map "$wb_ai_bot$wb_ai_exempt" $wb_ai_block {
    default 0;
    "10"    1;
}
