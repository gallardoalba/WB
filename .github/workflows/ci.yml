name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token del workflow solo necesita leer el repositorio. Cualquier permiso de
# escritura (comentarios, releases) se declara en el job que lo use.
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # Umbrales mínimos (líneas 92 %, ramas 80 %, funciones 88 %): impiden que
      # una funcionalidad nueva entre sin pruebas que la cubran.
      - name: Cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev

      # Las herramientas de desarrollo también son cadena de suministro:
      # ESLint, TypeScript y Playwright construyen y revisan lo que se
      # publica. Se informa aparte para no confundir el riesgo de ejecución
      # con el de construcción.
      #
      # Se usa `npm run audit:dev` y no `npm audit` a secas porque el criterio
      # del proyecto es el mismo que aplica el escaneo de la imagen: **bloquea
      # lo que se puede arreglar hoy** (aviso alto o crítico con una versión
      # corregida que no exige subir de versión mayor) e informa del resto en el
      # resumen del job. Un `npm audit` devuelve 1 también cuando no existe
      # parche —pasó con `picomatch` y CVE-2026-112366—, y entonces la rama
      # queda en rojo por algo que nadie puede resolver desde este repositorio.
      - name: Auditoría de dependencias de desarrollo
        run: npm run audit:dev

      # Inventario de lo que se ejecuta en producción (CycloneDX): ante un CVE
      # en una dependencia, el SBOM dice si esa versión llegó a desplegarse.
      # `npm test` incluye además el escaneo de credenciales del árbol de
      # trabajo (`tests/no-secrets.test.ts`), que no necesita ningún servicio.
      - name: Inventario de dependencias (SBOM)
        run: npm sbom --sbom-format=cyclonedx --omit=dev > sbom.cdx.json

      # v7 es la primera que declara `node24` en su `action.yml`: la v5 seguía
      # usando `node20` y dejaba el aviso de deprecación en cada ejecución.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-ciclo-de-vida
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Las pruebas de navegador corren contra el build de producción (ver
      # `playwright.config.ts`): es lo que se despliega y evita el ruido de
      # `ECONNRESET` que el servidor de desarrollo deja al cancelarse peticiones.
      # La URL pública se incrusta al compilar, así que va en este paso.
      - name: Compilar para producción
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

  e2e-crypto:
    # WebCrypto e IndexedDB difieren entre motores; el humo criptográfico se
    # ejecuta también en Firefox y WebKit, sin triplicar la suite entera.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Los dos motores son lo único que necesita este trabajo, y son lo más
      # pesado de instalar: entre 150 y 250 MB de navegadores más las librerías
      # del sistema (GStreamer y las fuentes de WebKit traen la mayor parte de
      # los ~139 MB de `apt`). La caché se invalida sola cuando cambia la
      # versión de Playwright, que es la que fija qué navegadores se bajan.
      - name: Caché de los navegadores
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Las librerías del sistema son el otro medio centenar de megas, y lo que
      # de verdad se atasca cuando el espejo de `apt` va lento. Los `.deb` se
      # guardan en un directorio propio y se copian a la caché de `apt` antes de
      # instalar: si están, no se vuelven a descargar. Es best-effort —una
      # versión nueva del paquete se baja igual—, no una condición.
      - name: Caché de los paquetes del sistema
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: apt-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--with-deps` sigue haciendo falta en un runner recién creado, y si el
      # espejo de `apt` falla se reintenta: un corte de red no puede tumbar un
      # trabajo que no tiene nada que arreglar en el repositorio.
      - name: Instalar Firefox y WebKit
        run: |
          mkdir -p ~/.cache/playwright-apt
          sudo cp -n ~/.cache/playwright-apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          npx playwright install --with-deps firefox webkit \
            || { echo "Reintento tras un fallo de red al instalar"; npx playwright install --with-deps firefox webkit; }
          sudo cp -n /var/cache/apt/archives/*.deb ~/.cache/playwright-apt/ 2>/dev/null || true

      # El humo levanta el servidor igual que la suite de Chromium: contra el
      # build de producción (`playwright.config.ts`), así que necesita el build.
      - name: Compilar para producción
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

      - name: Humo de cifrado en Firefox y WebKit
        run: npm run test:e2e:smoke

  imagen:
    # Mantiene el Dockerfile vivo: si deja de construir, se ve aquí.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir la imagen de producción
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # Se carga en el demonio para poder escanearla aquí mismo.
          load: true
          tags: wanderbibliothek:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Las dependencias de npm las cubre `npm audit`; esto mira lo que el
      # Dockerfile añade por su cuenta (paquetes de Debian del runner, el
      # propio Node). Solo corta el trabajo con vulnerabilidades **críticas y
      # corregidas**: un `HIGH` sin parche publicado no bloquea un despliegue
      # que no puede arreglarse hoy, pero queda en el registro.
      #
      # El escáner se instala desde su release con la suma de comprobación
      # verificada en vez de con `aquasecurity/trivy-action`: esa acción depende
      # de `aquasecurity/setup-trivy`, que retiró la versión que usaba y rompió
      # el trabajo sin que nada de este repositorio hubiera cambiado. Así la
      # versión queda fijada y no se arrastran acciones de terceros.
      - name: Instalar Trivy
        run: |
          base=https://github.com/aquasecurity/trivy/releases/download/v0.76.2
          curl -fsSL -o trivy_0.76.2_Linux-64bit.tar.gz  "$base/trivy_0.76.2_Linux-64bit.tar.gz"
          curl -fsSL -o trivy_0.76.2_checksums.txt       "$base/trivy_0.76.2_checksums.txt"
          grep -F 'trivy_0.76.2_Linux-64bit.tar.gz' trivy_0.76.2_checksums.txt | sha256sum -c -
          tar -xzf trivy_0.76.2_Linux-64bit.tar.gz trivy
          ./trivy --version

      - name: Exportar la imagen para el escáner
        run: docker save wanderbibliothek:ci -o imagen.tar

      - name: Vulnerabilidades de la imagen
        run: |
          ./trivy image --input imagen.tar \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress
