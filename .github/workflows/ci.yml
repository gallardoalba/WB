name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token del workflow solo necesita leer el repositorio. Cualquier permiso de
# escritura (comentarios, releases) se declara en el job que lo use.
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # Umbrales mínimos (líneas 92 %, ramas 80 %, funciones 88 %): impiden que
      # una funcionalidad nueva entre sin pruebas que la cubran.
      - name: Cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

  imagen:
    # Mantiene el Dockerfile vivo: si deja de construir, se ve aquí.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen de producción
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
