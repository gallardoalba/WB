name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token del workflow solo necesita leer el repositorio. Cualquier permiso de
# escritura (comentarios, releases) se declara en el job que lo use.
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # Umbrales mínimos (líneas 92 %, ramas 80 %, funciones 88 %): impiden que
      # una funcionalidad nueva entre sin pruebas que la cubran.
      - name: Cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev

      # Las herramientas de desarrollo también son cadena de suministro:
      # ESLint, TypeScript y Playwright construyen y revisan lo que se
      # publica. Se informa aparte para no confundir el riesgo de ejecución
      # con el de construcción.
      - name: Auditoría completa (incluye desarrollo)
        run: npm audit

      # Inventario de lo que se ejecuta en producción (CycloneDX): ante un CVE
      # en una dependencia, el SBOM dice si esa versión llegó a desplegarse.
      # `npm test` incluye además el escaneo de credenciales del árbol de
      # trabajo (`tests/no-secrets.test.ts`), que no necesita ningún servicio.
      - name: Inventario de dependencias (SBOM)
        run: npm sbom --sbom-format=cyclonedx --omit=dev > sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-ciclo-de-vida
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

  imagen:
    # Mantiene el Dockerfile vivo: si deja de construir, se ve aquí.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir la imagen de producción
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          # Se carga en el demonio para poder escanearla aquí mismo.
          load: true
          tags: wanderbibliothek:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Las dependencias de npm las cubre `npm audit`; esto mira lo que el
      # Dockerfile añade por su cuenta (paquetes de Debian del runner, el
      # propio Node). Solo corta el trabajo con vulnerabilidades **críticas y
      # corregidas**: un `HIGH` sin parche publicado no bloquea un despliegue
      # que no puede arreglarse hoy, pero queda en el registro.
      #
      # El escáner se instala desde su release con la suma de comprobación
      # verificada en vez de con `aquasecurity/trivy-action`: esa acción depende
      # de `aquasecurity/setup-trivy`, que retiró la versión que usaba y rompió
      # el trabajo sin que nada de este repositorio hubiera cambiado. Así la
      # versión queda fijada y no se arrastran acciones de terceros.
      - name: Instalar Trivy
        run: |
          base=https://github.com/aquasecurity/trivy/releases/download/v0.76.2
          curl -fsSL -o trivy_0.76.2_Linux-64bit.tar.gz  "$base/trivy_0.76.2_Linux-64bit.tar.gz"
          curl -fsSL -o trivy_0.76.2_checksums.txt       "$base/trivy_0.76.2_checksums.txt"
          grep -F 'trivy_0.76.2_Linux-64bit.tar.gz' trivy_0.76.2_checksums.txt | sha256sum -c -
          tar -xzf trivy_0.76.2_Linux-64bit.tar.gz trivy
          ./trivy --version

      - name: Exportar la imagen para el escáner
        run: docker save wanderbibliothek:ci -o imagen.tar

      - name: Vulnerabilidades de la imagen
        run: |
          ./trivy image --input imagen.tar \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress
