name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token del workflow solo necesita leer el repositorio. Cualquier permiso de
# escritura (comentarios, releases) se declara en el job que lo use.
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # Umbrales mínimos (líneas 92 %, ramas 80 %, funciones 88 %): impiden que
      # una funcionalidad nueva entre sin pruebas que la cubran.
      - name: Cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev

      # Las herramientas de desarrollo también son cadena de suministro:
      # ESLint, TypeScript y Playwright construyen y revisan lo que se
      # publica. Se informa aparte para no confundir el riesgo de ejecución
      # con el de construcción.
      - name: Auditoría completa (incluye desarrollo)
        run: npm audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

  imagen:
    # Mantiene el Dockerfile vivo: si deja de construir, se ve aquí.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir la imagen de producción
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
