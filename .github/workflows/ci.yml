name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token del workflow solo necesita leer el repositorio. Cualquier permiso de
# escritura (comentarios, releases) se declara en el job que lo use.
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # Umbrales mínimos (líneas 92 %, ramas 80 %, funciones 88 %): impiden que
      # una funcionalidad nueva entre sin pruebas que la cubran.
      - name: Cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

  imagen:
    # Mantiene el Dockerfile vivo: si deja de construir, se ve aquí.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir la imagen de producción
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    # La app nativa tiene su propio ciclo: pruebas de JVM (modelos, formatos,
    # diccionarios), lint y APK de depuración. Sin este trabajo, un cambio en el
    # servidor podía romper la app sin que nadie se enterara hasta compilarla a
    # mano.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # v3 intentaba instalar el paquete obsoleto «tools», que ya no existe en
      # el repositorio del SDK, y el trabajo moría en «Failed to find package
      # 'tools'». v4 usa las cmdline-tools actuales.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Instalar plataforma y build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Android 17 (API 37) lleva la versión menor en el nombre del paquete:
          # «platforms;android-37» no existe, el identificador es «android-37.0».
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Pruebas, lint y APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
